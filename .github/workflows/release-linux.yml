
name: Linux x86-64 release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin bittopos-server

      - name: Verify binary architecture
        run: file target/release/bittopos-server

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/bittopos-server dist/bittopos-server-linux-x86_64
          chmod 0755 dist/bittopos-server-linux-x86_64
          cd dist
          sha256sum bittopos-server-linux-x86_64 > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bittopos-server-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bittopos-server-linux-x86_64
            dist/SHA256SUMS

[package]
name = "bittopos-server"
version = "0.1.0"
edition = "2021"
description = "Servidor HTTP de Bittopos"
license = "AGPL-3.0-only"

[[bin]]
name = "bittopos-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bittopos-core = { git = "https://github.com/jasperalsain/bittopos-core", rev = "00f0bfda69a81b8d2cacc3c3ef589f30d964049e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v7"] }
